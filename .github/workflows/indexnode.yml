name: indexnode

on:
  push:
    branches: ["**"]
    paths: ["indexnode/**", ".github/workflows/indexnode.yml"]
    tags: ["indexnode-v*"]
  pull_request:
    paths: ["indexnode/**", ".github/workflows/indexnode.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: indexnode

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build IndexNode.Tests
      - name: Test
        run: dotnet test IndexNode.Tests --no-build

  release:
    if: startsWith(github.ref, 'refs/tags/indexnode-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish single-file apphosts
        run: |
          VERSION="${GITHUB_REF_NAME#indexnode-v}"
          mkdir -p dist
          for RID in win-x64 linux-x64; do
            dotnet publish IndexNode -c Release -r "$RID" --self-contained false \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:Version="$VERSION" -o "out/$RID"
            if [ "$RID" = win-x64 ]; then EXT=.exe; else EXT=; fi
            cp "out/$RID/indexnode$EXT" "dist/indexnode-$VERSION-$RID$EXT"
            (cd dist && sha256sum "indexnode-$VERSION-$RID$EXT" > "indexnode-$VERSION-$RID$EXT.sha256")
          done
          ls -l dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#indexnode-v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "IndexNode $VERSION" --generate-notes --latest=false
