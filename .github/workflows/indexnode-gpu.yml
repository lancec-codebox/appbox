name: indexnode-gpu

# Builds the GPU container and pushes it to GHCR: ghcr.io/<owner>/indexnode-gpu:<version> and :latest
on:
  push:
    tags: ["indexnode-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "image tag (default: the 0.6.0-dev build of this commit)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then V="${GITHUB_REF_NAME#indexnode-v}"; else V="${{ inputs.version }}"; fi
          [ -n "$V" ] || V="0.6.0-dev.${GITHUB_SHA::7}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/indexnode-gpu" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: indexnode
          file: indexnode/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
