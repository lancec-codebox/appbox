name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: media-helper-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  instrumented:
    # One smoke test of the embedded server on an emulator. Kept apart so a flaky emulator
    # never hides the build result above.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        env:
          MEDIA_HELPER_KEYSTORE_BASE64: ${{ secrets.MEDIA_HELPER_KEYSTORE_BASE64 }}
          MEDIA_HELPER_KEYSTORE_PASSWORD: ${{ secrets.MEDIA_HELPER_KEYSTORE_PASSWORD }}
          MEDIA_HELPER_KEY_ALIAS: ${{ secrets.MEDIA_HELPER_KEY_ALIAS }}
          MEDIA_HELPER_KEY_PASSWORD: ${{ secrets.MEDIA_HELPER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MEDIA_HELPER_KEYSTORE_BASE64" || { echo "release key secrets are not set"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$MEDIA_HELPER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export MEDIA_HELPER_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          # versionCode from the tag: 1.2.3 -> 10203
          IFS=. read -r MA MI PA <<< "${VERSION%%-*}"
          CODE=$((MA * 10000 + MI * 100 + PA))
          ./gradlew --no-daemon :app:assembleRelease -PversionName="$VERSION" -PversionCode="$CODE"
          rm -f "$RUNNER_TEMP/release.jks"
          ls -l app/build/outputs/apk/release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "app/build/outputs/apk/release/media-helper-$VERSION.apk" \
            --title "Media Helper $VERSION" --generate-notes

