name: medusa

on:
  push:
    branches: ["**"]
    paths: ["medusa/**", ".github/workflows/medusa.yml"]
    tags: ["medusa-v*"]
  workflow_dispatch:
  pull_request:
    paths: ["medusa/**", ".github/workflows/medusa.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: medusa

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: medusa-debug-apk
          path: medusa/app/build/outputs/apk/debug/*.apk

  instrumented:
    # Emulator smoke tests of the local server. Kept apart so a flaky emulator never hides the build result.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          working-directory: medusa
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

  release:
    if: startsWith(github.ref, 'refs/tags/medusa-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDIA_HELPER_KEYSTORE_BASE64 }}
          MEDUSA_KEYSTORE_PASSWORD: ${{ secrets.MEDIA_HELPER_KEYSTORE_PASSWORD }}
          MEDUSA_KEY_PASSWORD: ${{ secrets.MEDIA_HELPER_KEY_PASSWORD }}
          # Not a secret. Same key as before the rename; set the repo variable MEDUSA_KEY_ALIAS to override.
          MEDUSA_KEY_ALIAS: ${{ vars.MEDUSA_KEY_ALIAS || 'media-helper' }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "release key secrets are not set"; exit 1; }
          VERSION="${GITHUB_REF_NAME#medusa-v}"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export MEDUSA_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          # versionCode from the tag: 1.2.3 -> 10203
          IFS=. read -r MA MI PA <<< "${VERSION%%-*}"
          CODE=$((MA * 10000 + MI * 100 + PA))
          ./gradlew --no-daemon :app:assembleRelease -PversionName="$VERSION" -PversionCode="$CODE"
          rm -f "$RUNNER_TEMP/release.jks"
          ls -l app/build/outputs/apk/release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#medusa-v}"
          APK="app/build/outputs/apk/release/medusa-$VERSION.apk"
          # the in-app updater verifies its download against this checksum file
          scripts/make-release-assets.sh "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "Medusa $VERSION" --generate-notes
      - name: Update the stable install link (medusa-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#medusa-v}"
          APK="app/build/outputs/apk/release/medusa-$VERSION.apk"
          # a fixed release with a fixed asset name: .../releases/download/medusa-latest/medusa.apk
          # never "latest" (make_latest false), so IndexNode releases and this one never fight over the Latest badge
          cp "$APK" "$RUNNER_TEMP/medusa.apk"
          NOTES="Stable install link for the newest Medusa ($VERSION). Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          if gh release view medusa-latest >/dev/null 2>&1; then
            gh release edit medusa-latest --title "Medusa (latest: $VERSION)" --notes "$NOTES" --prerelease=false --latest=false
          else
            gh release create medusa-latest --target "$GITHUB_SHA" --title "Medusa (latest: $VERSION)" --notes "$NOTES" --latest=false
          fi
          gh release upload medusa-latest "$RUNNER_TEMP/medusa.apk" --clobber

  pages:
    # The https setup page (medusa/web/setup). Needs Pages enabled on the repo with source "GitHub Actions".
    if: startsWith(github.ref, 'refs/tags/medusa-v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: medusa/web
      - id: deployment
        uses: actions/deploy-pages@v4
