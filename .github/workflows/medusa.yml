name: medusa

on:
  push:
    branches: ["**"]
    paths: ["medusa/**", ".github/workflows/medusa.yml"]
  # Manual rebuild/publish of the version in the source (publishes only when its tag does not exist yet).
  # There is no tag trigger: the release job creates the tag itself, and a tag made with GITHUB_TOKEN does not start a workflow anyway.
  workflow_dispatch:
  pull_request:
    paths: ["medusa/**", ".github/workflows/medusa.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: medusa

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: medusa-debug-apk
          path: medusa/app/build/outputs/apk/debug/*.apk

  instrumented:
    # Emulator smoke tests of the local server. Kept apart so a flaky emulator never hides the build result.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          working-directory: medusa
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

  plan:
    # Does this push carry a version nobody has released yet? (Cheap; the release job checks again under its lock.)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^val appVersion = .*\?: "([^"]+)".*/\1/p' medusa/app/build.gradle.kts | head -1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "cannot read the Medusa version from medusa/app/build.gradle.kts (got '$VERSION')"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/medusa-v$VERSION" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "medusa-v$VERSION already exists: build only"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "medusa-v$VERSION is new: the release job publishes it"
          fi

  release:
    # One signed build of this commit becomes the versioned release (and the stable link). Only from main, only for a version without a tag.
    if: needs.plan.outputs.publish == 'true'
    needs: [build, plan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # two pushes to main can never publish at the same time; the second finds the tag and does nothing
      group: medusa-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: medusa-v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Is the tag still free?
        id: free
        working-directory: ${{ github.workspace }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "free=false" >> "$GITHUB_OUTPUT"; echo "$TAG exists already (another run published it): nothing to do"
          else
            echo "free=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.free.outputs.free == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.free.outputs.free == 'true'
      - name: Build signed release APK
        if: steps.free.outputs.free == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDIA_HELPER_KEYSTORE_BASE64 }}
          MEDUSA_KEYSTORE_PASSWORD: ${{ secrets.MEDIA_HELPER_KEYSTORE_PASSWORD }}
          MEDUSA_KEY_PASSWORD: ${{ secrets.MEDIA_HELPER_KEY_PASSWORD }}
          # Not a secret. Same key as before the rename; set the repo variable MEDUSA_KEY_ALIAS to override.
          MEDUSA_KEY_ALIAS: ${{ vars.MEDUSA_KEY_ALIAS || 'media-helper' }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "release key secrets are not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export MEDUSA_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          # versionCode from the version: 1.2.3 -> 10203
          IFS=. read -r MA MI PA <<< "${VERSION%%-*}"
          CODE=$((MA * 10000 + MI * 100 + PA))
          ./gradlew --no-daemon :app:assembleRelease -PversionName="$VERSION" -PversionCode="$CODE"
          rm -f "$RUNNER_TEMP/release.jks"
          ls -l app/build/outputs/apk/release
      - name: Publish release
        if: steps.free.outputs.free == 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/medusa-$VERSION.apk"
          # the in-app updater verifies its download against this checksum file
          scripts/make-release-assets.sh "$APK"
          NOTES_FILE="docs/RELEASE-NOTES-$VERSION.md"
          if [ -f "$NOTES_FILE" ]; then NOTES=(--notes-file "$NOTES_FILE"); else NOTES=(--generate-notes); fi
          # --target makes gh create the tag at this commit
          if ! gh release create "$TAG" "$APK" "$APK.sha256" --target "$GITHUB_SHA" --title "Medusa $VERSION" "${NOTES[@]}"; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then echo "$TAG was created meanwhile: nothing to do"; exit 0; fi
            exit 1
          fi
      - name: Update the stable install link (medusa-latest)
        if: steps.free.outputs.free == 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/medusa-$VERSION.apk"
          # a fixed release with a fixed asset name: .../releases/download/medusa-latest/medusa.apk
          # never "latest" (make_latest false), so IndexNode releases and this one never fight over the Latest badge
          cp "$APK" "$RUNNER_TEMP/medusa.apk"
          NOTES="Stable install link for the newest Medusa ($VERSION). Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          if gh release view medusa-latest >/dev/null 2>&1; then
            gh release edit medusa-latest --title "Medusa (latest: $VERSION)" --notes "$NOTES" --prerelease=false --latest=false
          else
            gh release create medusa-latest --target "$GITHUB_SHA" --title "Medusa (latest: $VERSION)" --notes "$NOTES" --latest=false
          fi
          gh release upload medusa-latest "$RUNNER_TEMP/medusa.apk" --clobber

  pages:
    # The https setup page (medusa/web/setup). Needs Pages enabled on the repo with source "GitHub Actions".
    # Only from main: the github-pages environment accepts no other ref.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: medusa/web
      - id: deployment
        uses: actions/deploy-pages@v4
