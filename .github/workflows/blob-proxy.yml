name: blob-proxy

# Tests blob-proxy on every push that touches it; on main, builds its container and pushes it to GHCR as
# ghcr.io/<owner>/blob-proxy:<version> and :latest when that version has no image yet (a version bump). The image is public and generic:
# it holds no credentials (callers send their own SAS) and the allowed accounts come from the ALLOWED_ACCOUNTS environment variable.
on:
  push:
    branches: ["**"]
    paths: ["blob-proxy/**", ".github/workflows/blob-proxy.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "image tag (default: the version in BlobProxy.csproj); a manual run pushes even when the tag exists"
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test blob-proxy/BlobProxy.Tests -c Release

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: blob-proxy-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SRC="$(sed -nE 's/.*<Version>([^<]+)<\/Version>.*/\1/p' blob-proxy/BlobProxy/BlobProxy.csproj | head -1)"
          [ -n "$SRC" ] || { echo "cannot read <Version> from blob-proxy/BlobProxy/BlobProxy.csproj"; exit 1; }
          V="${INPUT_VERSION:-$SRC}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/blob-proxy"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! docker buildx imagetools inspect "$IMAGE:$V" >/dev/null 2>&1; then
            echo "push=true" >> "$GITHUB_OUTPUT"; echo "pushing $IMAGE:$V"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"; echo "$IMAGE:$V exists already: nothing to do"
          fi
      - uses: docker/build-push-action@v6
        if: steps.v.outputs.push == 'true'
        with:
          context: blob-proxy
          file: blob-proxy/Dockerfile
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
